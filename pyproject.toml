[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naiyue-test-agent"
dynamic = ["version"]
description = "A local programming and testing agent with Web and terminal interfaces"
readme = "README.md"
requires-python = ">=3.12.4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Naiyue Test Agent contributors"}]
# Release pins preserve the validated runtime snapshot; test/build tools are dev-only.
dependencies = [
    "Pillow==12.3.0",
    "annotated-types==0.8.0",
    "anthropic==1.9.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "distro==1.9.0",
    "docstring_parser==0.18.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.13.1",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "idna==3.20",
    "jiter==0.17.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain==1.4.2",
    "langchain-anthropic==1.7.5",
    "langchain-core==1.6.6",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.6.6",
    "langchain-protocol==0.0.19",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.5",
    "langsmith==0.14.1",
    "ollama==0.6.3",
    "openai==3.19.2",
    "orjson==3.12.0",
    "ormsgpack==1.12.2",
    "packaging==26.3",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "PyYAML==6.0.3",
    "regex==2026.9.10",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "sniffio==1.3.1",
    "tenacity==9.1.4",
    "tiktoken==0.14.0",
    "truststore==0.10.4",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
    "uuid_utils==0.17.1",
    "websockets==16.1.1",
    "xxhash==4.0.1",
    "zstandard==0.25.0",
    "aiosqlite==0.22.1",
    "langgraph-checkpoint-sqlite==3.1.1",
    "sqlite-vec==0.1.9",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "starlette==1.7.0",
    "annotated-doc==0.0.5",
    "opentelemetry-api==1.45.1",
    "click==8.5.0",
    "attrs==26.1.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "cffi==2.1.1",
    "python-multipart==0.0.32",
    "sse-starlette==3.5.0",
    "pycparser==3.11",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build==1.3.0", "twine==6.2.0"]

[project.scripts]
nyt = "naiyue_test_agent.cli:main"

[project.urls]
Repository = "https://github.com/tlzmw001/naiyue-test-agent"
Issues = "https://github.com/tlzmw001/naiyue-test-agent/issues"

[tool.setuptools.dynamic]
version = {attr = "naiyue_test_agent.__version__"}

[tool.setuptools.packages.find]
include = ["naiyue_test_agent", "naiyue_test_agent.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
naiyue_test_agent = [
    "_assets/native.json", "_assets/bin/rg", "_assets/bin/fd",
    "_assets/bin/rg.exe", "_assets/bin/fd.exe",
    "_assets/web/index.html", "_assets/web/assets/*.js", "_assets/web/assets/*.css",
    "_assets/licenses/*",
]
