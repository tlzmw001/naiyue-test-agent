# 当前可用的工具、权限、进程、进度、用量/诊断保存及角色定义样例（Spec085-14 / Spec087 / Spec091 / Spec090C / Spec086-S1—S6 / Spec108 / Spec109）。
# 默认位置：~/.naiyue-test-agent/settings.toml，与 models.json 同目录。
# 文件缺失使用默认；读取失败、TOML语法错误、权限/storage/角色定义非法会终止启动。
# max_active_runs / web_event_cache_bytes / tools / process / tool_output / progress / usage_persistence / diagnostics额度非法时分别警告并回退该部分默认，保留合法权限规则。
# 权限规则启动时读取并校验，不随工具调用重新读文件；修改文件后重启服务。
# 已接八执行工具及通用subagent；tools.subagent配置报告预算，[[subagents]]配置角色。
# 完整目标字段见 tool-runtime.example.toml，不能直接整份套用。

# 同一应用最多同时占用的根运行数，严格正整数；默认10，非法时警告回退10。
# 普通任务、手动压缩、根审批恢复计入；必要保存结束才释放，子任务不另占根额度。
# 满额立即拒绝、不排队；不是单批工具并发量，也不是所有模型请求的限流。
# 启动时读取，修改后重启；Web多会话任务入口待104-02接线。
max_active_runs = 10

# 自动会话标题的最大字符数（1—120）；默认40，非法时仅此字段回退。
# 从首条用户任务提取，不额外请求模型，不覆盖手工名称；修改后重启。
session_title_max_chars = 40

# 每次根运行（含子智能体）的Web事件重播缓存UTF-8 JSON字节上限；严格正整数，默认4 MiB。
# 同时保留原有最多256条事件的限制；任一超限从最早事件淘汰，落后客户端重新同步。
# 只限制待补读事件载荷，不限制聊天档案、当前消息/进度视图、网络在途批次或进程总内存。
# 单条事件仍受WebSettings.max_frame_bytes（默认1 MiB）约束；合法事件不缓存仍会更新当前视图。
# 非法时警告并只回退此字段默认；启动读取，修改后重启，程序不会自动改写此文件。
web_event_cache_bytes = 4194304

# 持久用量待写预算，整个应用共享；不限制模型或工具执行。
# 条数包含开始/结束事实及已交给数据库但尚未确认的一条；默认1024。
# 字节为有限事实JSON的UTF-8预算，默认4 MiB，不代表进程总内存。
# 任一超限拒绝新事实并标统计缺口，已接收的记录继续写入。
# 非法预算警告并回退本节默认；修改后重启，私有配置不会自动写入。
[usage_persistence]
max_pending_events = 1024
max_pending_bytes = 4194304

# 仅持久应用保存诊断；有限关键边界与根/子关联，不复制消息正文、图片、命令参数或工具输出。
# 额度非法警告并回退本节默认；启动读取，修改后重启，不自动改写私有配置。
[diagnostics]
# 应用共享的待写事件数及UTF-8 JSON字节数，含在途IO；超限丢新细节并标缺口，不中断运行。
# 最多同时持有同样数量的根捕获状态；有限终态元数据另保存在这些有界状态中。
max_pending_events = 1024
max_pending_bytes = 4194304
# 单根运行包含全部子智能体的诊断载荷上限；不限制工具或模型运行。
max_run_bytes = 1048576
# 从单根及工作区预算中预留给摘要/终态；至少2048，且必须小于max_run_bytes。
summary_reserve_bytes = 4096
# 整个工作区有效诊断载荷上限（256 MiB），须不小于max_run_bytes；不是SQLite文件/RSS上限。
max_workspace_bytes = 268435456
# 非活动根记录的保留天数；先过期，再按结束顺序整根清理，不删除聊天、用量或checkpoint。
retention_days = 30
# 每次启动/收尾/将超预算时最多清理多少根，短事务小批处理，不运行定时清理线程。
cleanup_batch_runs = 32

# 子Agent角色定义：取消下面整个示例块的行首注释后生效，可重复[[subagents]]定义多个角色。
# S1—S6已接定义、执行、CLI/Web子批审批及停止/保存；默认无角色，不自动发起模型调用。
# 配置仅在启动时读取；修改工具列表、描述、提示词或模型后重启。当前不覆盖同名角色。
# name：唯一角色名，字符限英文字母/数字/下划线/点/短横线；最终作为subagent的agent参数。
# description：供父模型决定何时委派的短说明；不要把完整工作流程塞进这里。
# system_prompt：子角色的职责、工作步骤及结果要求；不授予额外工具或权限。
# tool_names：已登记工具名称数组；[]表示无工具。不能含subagent，首版只支持一层。
# 自定义工具须先由可信启动代码放入builder的tools参数；配置不会import或执行Python插件。
# model_id：同目录models.json中的已有ID；省略表示启动子实例时继承父模型。
# max_model_calls：每次委派的子图主模型调用次数上限；省略不加额外次数限制，不要填0或true。
# 上限仅计子图主模型轮数，不是HTTP重试/Auto审查/摘要调用总数；S3审批恢复已沿用同一计数。
# 第N次若已给最终答复可成功；需要第N+1次时不再请求，向父返回错误，已执行工具不回滚。
# 下面的提示词按公开Claude/OpenAI角色示例的职责、步骤、证据结构拟定，不是其私有提示词。
# [[subagents]]
# name = "tester"
# description = "测试验证子Agent；独立检查改动并运行相关测试，返回实际结果与未验证范围。"
# tool_names = ["read", "grep", "find", "ls", "bash"]
# # max_model_calls = 12  # 可选；需要限制时移除本行两层注释，放在system_prompt多行字符串之外。
# system_prompt = """
# 你负责完成父Agent委派的测试验证任务。
# 先确认任务范围，再读取相关代码和测试，选择与改动有关的验证。
# 依据实际工具结果报告，不把未运行的测试描述为通过。
# 区分测试发现的问题、环境问题与工具执行失败；不主动修改源码。
# 最终返回检查范围、执行的验证、实际结果、问题证据及未验证部分。
# """
# 默认省略model_id/max_model_calls；需要时在本角色内填写已有模型ID/正整数。

[tools.subagent]
# 子任务最终报告的正文行数、UTF-8字节上限，均须大于0；与角色max_model_calls分别配置。
# 保留开头完整行；首行过长时保留完整字符前缀。截断提示另计；完整历史留在子checkpoint。
max_result_lines = 2000
max_result_bytes = 65_536

[progress]
# 是否产生工具进度事件；不影响工具结果、停止、权限或执行期限。
# 091A提供后端事件，091B已接Web/CLI进度显示及最新快照。
enabled = true
# 同一阶段连续更新的最小发送间隔，单位毫秒；0表示每次真实活动都发送。
# 阶段变化即时报告，不创建心跳或计时任务；不会把无输出当作卡死。
min_interval_milliseconds = 200
# 单次进度中最新文本尾部的UTF-8字节上限，必须大于0。
# 文件工具不发送正文/图片；Shell发送规范化尾部，消费者按快照替换。
max_text_bytes = 8_192

[storage]
# 会话数据根目录；不改变 models.json / settings.toml 的配置位置。
# 未设置默认 ~/.naiyue-test-agent/data。必须是绝对路径，支持 ~；修改后重启。
# Windows可用TOML单引号避免反斜杠转义，例如 data_dir = 'D:\NaiyueData'。
# data_dir = '/absolute/data'
# 每个工作区实际库位于 data_dir/workspaces/<workspace_id>/sessions.sqlite。
# 路径不可用时启动失败，不回退；改变data_dir不会自动搬迁已有历史。

[permissions]
# Default：剩余Ask交人工；NoAsk：拒绝Ask；Auto：先模型审查；BypassApprovals：允许Ask但仍服从Deny。
mode = "Default"
# 所有匹配字段取AND，规则之间取OR；任何Deny优先于所有Allow。
# tool为精确名字或"*"；path仅用于声明文件目标的工具。
# 路径支持组件*、?和跨目录**；${workspace}按当前会话工作区替换。
# 示例：同目录其余文件Allow，但private.txt始终Deny。
# deny = [{ tool = "read", path = "${workspace}/docs/private.txt" }]
# allow = [{ tool = "read", path = "${workspace}/docs/**" }]
# 外部目录改写为绝对路径，例如/absolute/shared/**或Windows的'C:\shared\**'。
# 命令只按完整command精确匹配，不能用*或前缀代替命令解析：
# allow = [{ tool = "bash", args = { command = "python -m pytest -q" } }]
# args只接受工具公开标量参数，键不存在或类型不符会在创建Agent前报错。
# 未配置的普通工作区文件默认Allow；隐藏、.pem/.key和外部目标默认Ask。
# 目录授权不会自动授予隐藏/私密子目标，未获许可的范围跳过并反馈；Deny始终过滤。
deny = []
allow = []

[process]
# 执行期限之外的一份总收尾预算，所有步骤共用，不是每步重新给5秒。
cleanup_timeout_seconds = 5
# Shell父退出但后代仍持有管道时，最后输出后的静默等待；主动关流会标不完整。
# 显式设置timeout时持续输出仍受本次执行期限限制；搜索不能用此静默判断内容完整。
shell_exit_quiet_milliseconds = 100
# 回调与消费者间未处理字节高水位；触及后暂停读取，降到半水位恢复。
# 已交付的一个读取块允许有限超量；不是完整输出的内存缓存或归档配额。
max_pending_output_bytes = 1_048_576

# 使用Auto前取消下面注释，填写同目录models.json中已存在的模型ID。
# 配了auto时，两个ID即使在Default模式下也会在创建Agent前校验；不支持运行中重载。
# 快/详审各自沿用对应模型的thinking、context_window、max_output_tokens、timeout和retry配置。
# 只在快审有效Ask时详审；审查失败、非法结果或输入超预算直接交人工。
# [permissions.auto]
# fast_model_id = "review-fast"
# detailed_model_id = "review-detailed"
# 模型reason的字符数上限；超出视为无效结果，不截断后继续放行。
# max_reason_chars = 512

[tools.read]
# 未提供 limit 时每页的行数，必须不大于 max_limit。
default_limit = 2000
# 模型一次调用允许提出的最大行数。
max_limit = 2000
# 正文 UTF-8 字节预算，不含少量分页提示；超长首行仅返回完整字符前缀并标明余文未返回。
# offset/limit按行分页，不能用来续读被截断的同一行后半部分。
max_output_bytes = 65_536
# path 输入的字符数上限；操作系统路径限制仍有效。
max_path_chars = 4096

[tools.read.image]
# 编码图片输入上限；在读入和解码前检查，独立于文字64KiB预算。
max_input_bytes = 33_554_432
# 解码前宽×高的像素数上限；Pillow自身的炸弹保护也会生效。
max_pixels = 40_000_000
# 输出最长边，等比例缩小，不放大较小图片；先按EXIF校正方向。
max_dimension = 2000
# base64负载字节上限，独立于少量MIME/尺寸文字；有限缩小仍超限则报错。
max_base64_bytes = 4_718_592

[tools.ls]
# 一层列名；跳过/检查失败/停止会说明结果不完整，不以不完整清单冒充empty。
# 未提供 limit 时返回的条目数，必须不大于 max_limit。
default_limit = 500
# 模型一次调用允许提出的最大条目数。
max_limit = 2000
# 清单正文 UTF-8 字节预算，不含少量截断提示。
max_output_bytes = 51_200
# path 输入的字符数上限。
max_path_chars = 4096

[tools.write]
# 获取旧正文用于差异的最大输入；没有独立读取授权时跳过，写入仍可继续。
max_diff_input_bytes = 1048576
# 分别限制保存的差异、修改后预览、完整patch的UTF-8字节；不增加执行期限。
max_diff_bytes = 65536
max_preview_bytes = 65536
max_patch_bytes = 1048576
# 授权执行后自动创建缺失父目录；输入校验先于mkdir，拒绝或待审批不创建目录。
# 中途失败时已建目录可能保留，不会自动递归回滚删除。
# content 输入的 UTF-8 字节上限；不是字符数，不限制原文件大小。
max_input_bytes = 1_048_576
# path 输入的字符数上限。
max_path_chars = 4096

[tools.edit]
# 本次全部 oldText + newText 的 UTF-8 字节总量上限。
# 不限制原文件或修改后文件的大小；原文件仍按块处理。
max_input_bytes = 1_048_576
# path 输入的字符数上限。
max_path_chars = 4096
# 归一化匹配的UTF-8文本及源字节坐标缓冲预算；超限不影响全部精确唯一的编辑。
max_normalization_buffer_bytes = 1_048_576
# 归一化及diff收集时单个源行的字节上限；超长精确编辑可执行但省略对应反馈。
max_affected_line_bytes = 1_048_576
# 返回模型的局部diff字节预算；截断时明确标记。
max_diff_bytes = 65_536
# artifact中修改后局部预览的字节预算；截断时明确标记。
max_preview_bytes = 65_536
# 完整unified patch的字节上限，并约束变化区收集；超过则整份patch省略。
max_patch_bytes = 1_048_576

[tools.grep]
# 默认/最大匹配行数；上下文不占匹配名额，但占输出字节。
default_limit = 100
max_limit = 1000
# 每处匹配前后默认/最大上下文行数。
default_context_lines = 0
max_context_lines = 10
# 单行源文字片段字符数；超长则裁片并说明，不限制扫描文件大小。
max_line_chars = 2000
# 匹配与上下文正文 UTF-8 字节预算；不含有界的跳过范围和少量状态提示。
max_output_bytes = 51_200
# 默认无执行期限；工具调用可传 timeout（秒），省略/null/0不限时，正整数指定本次期限。
# 模型输入的 pattern/path/glob 字符数，不代表候选总量或扫描大小。
max_pattern_chars = 4096
max_path_chars = 4096
max_glob_chars = 4096
# 一条 JSONL/NUL 协议记录的字节上限；超限丢弃该记录并明确结果不完整。
# 独立于单行显示片段，不能用 rg --max-columns 代替这个预算。
max_record_bytes = 1_048_576
# native stderr 仅保留此字节数用于识别原因，不把原诊断正文写日志。
max_diagnostic_bytes = 8192
# 每组 argv 的编码字节预算，不是总候选数；Windows按实际命令行UTF-16编码计算。
# OS对argv与环境仍有自己的上限，启动失败不会静默重试。
max_argument_bytes = 16_384

[tools.find]
# 需要 PATH 中的 fd（Linux也识别同程序的fdfind名称），不自动下载/安装。
# 文件和目录都占条目；先过滤权限，再计返回名额。
default_limit = 1000
max_limit = 2000
# 返回路径正文 UTF-8 字节预算，不含有界跳过范围和少量状态提示。
max_output_bytes = 51_200
# 默认无执行期限；工具调用可传 timeout（秒），省略/null/0不限时，正整数指定本次期限。
# 模型输入字符数上限，不限制搜索产生的绝对路径记录。
max_pattern_chars = 4096
max_path_chars = 4096
# 一条NUL路径记录的字节上限；独立于模型path输入与进程输出队列。
max_record_bytes = 65_536
# native stderr 诊断尾部字节数。
max_diagnostic_bytes = 8192

[tools.bash]
# 可选解释器路径；省略时发现原生Bash（Windows为Git Bash）。不可用时保留登记并在调用时具体报错。
# executable = "/absolute/path/to/bash"
# command 输入的字符数上限；不保证超过操作系统命令长度限制后仍可执行。
max_command_chars = 8192
# 装配时固定版本探测的秒数预算；超时只报告版本unknown，不执行用户脚本。
probe_timeout_seconds = 5
# 默认无执行期限；工具调用可传 timeout（秒），省略/null/0不限时，正整数指定本次期限。
# stdout/stderr 合并后的末尾正文最多保留的行数。
max_output_lines = 2000
# 同一尾部正文的 UTF-8 字节上限：64 KiB，与行数限制同时生效。
max_output_bytes = 65_536
# 一次 Bash 调用所有归档文件的实际落盘字节总和：16 MiB。
# 原始字节及必要的 UTF-8 文本视图都计入；不表示输出超过该值就停止命令。
max_archive_bytes = 16_777_216
# 捕获原始输出时采用的文本编码；不自动猜测任意外部程序的编码。
output_encoding = "utf-8"

[tools.bash.environment]
# 从继承环境中显式移除的变量名，名称不存在时无需报错；可按需求修改此列表。
# 如需排除某个 Agent 私有变量，在此明确填写名称，不按 TOKEN/KEY 等模式批量删除。
# BASH_ENV会让非交互Bash读取脚本；NAIYUE_WEB_TOKEN是Agent服务认证变量。
unset_env = ["BASH_ENV", "NAIYUE_WEB_TOKEN"]
# 在继承/覆盖后的 PATH 前增加的工具目录；条目为目录，不是拼接好的 PATH 字符串。
path_prepend = []

[tools.bash.environment.values]
# 显式新增/覆盖环境变量的字符串值；空表表示不覆盖。
# 这里只记录非敏感的固定设置；已有测试凭证正常继承，不把真实凭证写入样例或日志。
# TEST_ENV = "staging"

[tools.powershell]
# 可选解释器路径；省略时优先发现 pwsh 7+，Windows 可回退 powershell.exe 5.1。
# executable = 'C:\Program Files\PowerShell\7\pwsh.exe'
# PowerShell command 输入的字符数上限，与 Bash 分别配置。
max_command_chars = 8192
# 装配时固定版本探测的秒数预算；超时只报告版本unknown，不执行用户脚本。
probe_timeout_seconds = 5
# 默认无执行期限；工具调用可传 timeout（秒），省略/null/0不限时，正整数指定本次期限。
# 合并后的末尾正文行数上限。
max_output_lines = 2000
# 同一尾部正文的 UTF-8 字节上限：64 KiB。
max_output_bytes = 65_536
# 一次 PowerShell 调用的实际归档总量：16 MiB，含原始文件和条件文本视图。
max_archive_bytes = 16_777_216
# 适配器初始化文本输出后预期的编码；原生程序使用其他编码时需明确调整。
# 该候选默认仍须用 Windows PowerShell 5.1/7 实机验证，不能仅靠此字段保证兼容。
output_encoding = "utf-8"
# 仅Windows PowerShell进程的执行策略选择：inherit尊重当前策略；bypass只影响该子进程。
# 工程默认建议inherit，不调用Set-ExecutionPolicy改用户/机器策略；企业策略仍有效。
execution_policy = "inherit"

[tools.powershell.environment]
# 从继承环境中显式移除的变量名；与 Bash 独立配置，无需逐个允许其余变量。
unset_env = ["NAIYUE_WEB_TOKEN"]
# 在继承/覆盖后的 PATH 前添加的工具目录，按 Windows/宿主平台规则合成。
path_prepend = []

[tools.powershell.environment.values]
# 显式新增/覆盖的非敏感字符串值；空表表示不覆盖，规则与 Bash 相同。

[tool_output]
# 同一工作区全部受管 Shell 日志的实际落盘总量：128 MiB。
# Bash/PowerShell、并发会话及已有受管归档共用此额度，不能各拿一份 128 MiB。
# 单次额度与本额度都必须满足；达到任一额度后继续采集最新尾部，明确归档不完整。
max_workspace_archive_bytes = 134_217_728
