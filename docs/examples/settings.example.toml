# Naiyue Test Agent 0.4.0：settings.toml 字段示例（包括已注释的可选字段）。
# 通用填写说明见 ../0.3.0功能与配置指南.md；0.4.0记忆及归档变化见 ../releases/0.4.0.md。
# 默认位置：~/.naiyue-test-agent/settings.toml；Windows为 %USERPROFILE%\.naiyue-test-agent\settings.toml。
# 文件名是 settings.toml（有s）；不是项目目录中的文件，也不是 models.json。
# 本例启用常规默认值；代理认证、Auto、子角色需自行填写，两个MCP示例默认禁用。
# 模型地址/Key/思考参数/模型重试写 models.json；Web端口用 nyt --port，不在本文件添加这些字段。
# 秒、毫秒、字节分别按字段名标明；除明确注明外，额度必须为正数，不能把0当作不限。
# TOML中先写顶层字段，再写[分节]；数组用[]，布尔用true/false，字符串须加引号。
# Windows路径优先单引号，如 'D:\tools\python.exe'，避免双引号中的反斜杠转义。
# 文件缺失使用默认；读取/TOML语法/未知顶层字段或权限/storage/角色/网络/MCP/重试/shell_tasks非法会终止启动。
# tools/process/progress/usage_persistence/diagnostics或顶层数值非法时警告并回退该部分默认。
# checkpoint_retention非法时告警并关闭修剪；旧tool_output.max_workspace_archive_bytes只告警忽略，不再配置。
# 一般修改后重启；只有MCP新增/名单/启停可通过“刷新工具与模式”或 :mcp-refresh 显式应用。

# CLI/Web新根会话的初始工具；省略保留当前默认（内置工具但不含Bash/PowerShell/MCP）。
# []表示零工具；明确列表按顺序选择，可包含已登记的mcp__服务ID__原工具名。
# 名称非法/重复或未登记会报错；旧会话保留自己保存的选择，子角色仍用tool_names。
# PowerShell被选中仍受权限/Auto审批控制；修改后重启，对之后新建会话生效。
# Windows示例；若需要子Agent或后台管理工具，一并加入subagent、task_list、task_output、task_stop。
# subagent_list由subagent开关自动配套，不需单独加入；默认名单不是权限白名单。
# default_active_tools = ["read", "ls", "find", "grep", "write", "edit", "powershell", "web_search", "web_fetch", "subagent", "task_list", "task_output", "task_stop"]

# 同一应用最多同时占用的根运行数，严格正整数；默认10，非法时警告回退10。
# 普通任务、手动压缩、根审批恢复计入；必要保存结束才释放，子任务不另占根额度。
# 满额立即拒绝、不排队；不是单批工具并发量，也不是所有模型请求的限流。
# 启动时读取，修改后重启；CLI/Web均已接入。
max_active_runs = 10

# 自动会话标题的最大字符数（1—120）；默认40，非法时仅此字段回退。
# 从首条用户任务提取，不额外请求模型，不覆盖手工名称；修改后重启。
session_title_max_chars = 40

# 每次根运行（含子智能体）的Web事件重播缓存UTF-8 JSON字节上限；严格正整数，默认4 MiB。
# 同时保留原有最多256条事件的限制；任一超限从最早事件淘汰，落后客户端重新同步。
# 只限制待补读事件载荷，不限制聊天档案、当前消息/进度视图、网络在途批次或进程总内存。
# 单条事件仍受WebSettings.max_frame_bytes（默认1 MiB）约束；合法事件不缓存仍会更新当前视图。
# 非法时警告并只回退此字段默认；启动读取，修改后重启，程序不会自动改写此文件。
web_event_cache_bytes = 4194304

# 持久用量待写预算，整个应用共享；不限制模型或工具执行。
# 条数包含开始/结束事实及已交给数据库但尚未确认的一条；默认1024。
# 字节为有限事实JSON的UTF-8预算，默认4 MiB，不代表进程总内存。
# 任一超限拒绝新事实并标统计缺口，已接收的记录继续写入。
# 非法预算警告并回退本节默认；修改后重启，私有配置不会自动写入。
[projects]
# 开发分支 R1-03：可选默认新建位置，仅影响新建项目时的初始位置；不限制选择其他目录。
# 省略表示由用户选择父目录；修改不移动已有项目，加载配置不会创建目录。
# default_parent_dir = "/absolute/path/to/projects"

# 审查后显式交付，使用本机 Git 预算，不将凭据传进沙箱。
# 超过额度明确拒绝，不删除旧操作或自动重放未知动作；修改后重启。
[delivery]
max_commits = 256
max_operations_per_project = 1024

[usage_persistence]
max_pending_events = 1024
max_pending_bytes = 4194304

# 仅持久应用保存诊断；有限关键边界与根/子关联，不复制消息正文、图片、命令参数或工具输出。
# 额度非法警告并回退本节默认；启动读取，修改后重启，不自动改写私有配置。
[diagnostics]
# 应用共享的待写事件数及UTF-8 JSON字节数，含在途IO；超限丢新细节并标缺口，不中断运行。
# 最多同时持有同样数量的根捕获状态；有限终态元数据另保存在这些有界状态中。
max_pending_events = 1024
max_pending_bytes = 4194304
# 单根运行包含全部子智能体的诊断载荷上限；不限制工具或模型运行。
max_run_bytes = 1048576
# 从单根及工作区预算中预留给摘要/终态；至少2048，且必须小于max_run_bytes。
summary_reserve_bytes = 4096
# 整个工作区有效诊断载荷上限（256 MiB），须不小于max_run_bytes；不是SQLite文件/RSS上限。
max_workspace_bytes = 268435456
# 非活动根记录的保留天数；先过期，再按结束顺序整根清理，不删除聊天、用量或checkpoint。
retention_days = 30
# 每次启动/收尾/将超预算时最多清理多少根，短事务小批处理，不运行定时清理线程。
cleanup_batch_runs = 32

# 子Agent角色定义：取消下面整个示例块的行首注释后生效，可重复[[subagents]]定义多个角色。
# S1—S6已接定义、执行、CLI/Web子批审批及停止/保存；默认无角色，不自动发起模型调用。
# 配置仅在启动时读取；修改工具列表、描述、提示词或模型后重启。当前不覆盖同名角色。
# name：唯一角色名，字符限英文字母/数字/下划线/点/短横线；最终作为subagent的agent参数。
# description：供父模型决定何时委派的短说明；不要把完整工作流程塞进这里。
# system_prompt：子角色的职责、工作步骤及结果要求；不授予额外工具或权限。
# tool_names：已登记工具名称数组；[]表示无工具。不能含subagent，首版只支持一层。
# 自定义工具须先由可信启动代码放入builder的tools参数；配置不会import或执行Python插件。
# model_id：同目录models.json中的已有ID；省略表示启动子实例时继承父模型。
# max_model_calls：每次委派的子图主模型调用次数上限；省略不加额外次数限制，不要填0或true。
# 上限仅计子图主模型轮数，不是HTTP重试/Auto审查/摘要调用总数；S3审批恢复已沿用同一计数。
# 第N次若已给最终答复可成功；需要第N+1次时不再请求，向父返回错误，已执行工具不回滚。
# 下面的提示词按公开Claude/OpenAI角色示例的职责、步骤、证据结构拟定，不是其私有提示词。
# [[subagents]]
# name = "tester"
# description = "测试验证子Agent；独立检查改动并运行相关测试，返回实际结果与未验证范围。"
# tool_names = ["read", "grep", "find", "ls", "bash"]
# # max_model_calls = 12  # 可选；需要限制时移除本行两层注释，放在system_prompt多行字符串之外。
# system_prompt = """
# 你负责完成父Agent委派的测试验证任务。
# 先确认任务范围，再读取相关代码和测试，选择与改动有关的验证。
# 依据实际工具结果报告，不把未运行的测试描述为通过。
# 区分测试发现的问题、环境问题与工具执行失败；不主动修改源码。
# 最终返回检查范围、执行的验证、实际结果、问题证据及未验证部分。
# """
# 默认省略model_id/max_model_calls；需要时在本角色内填写已有模型ID/正整数。
# 可选写法：model_id = "your-existing-model-id"；max_model_calls = 12（放在多行提示词之外）。
# Windows角色将tool_names中的bash换成powershell；子角色不能使用subagent/subagent_list再委派。
# 0.3.0的agent_id是模型调用subagent时的参数，不是角色配置项；续跑仍使用当前角色定义。

[tools.subagent]
# 子任务最终报告的正文行数、UTF-8字节上限，均须大于0；与角色max_model_calls分别配置。
# 保留开头完整行；首行过长时保留完整字符前缀。截断提示另计；完整历史由会话归档保留。
max_result_lines = 2000
max_result_bytes = 65_536
max_list_items = 20            # subagent_list每页最多展示的实例数。
max_list_bytes = 8192          # 整页JSON的UTF-8字节上限，含分页信息。
task_preview_chars = 160       # 列表中每条委派任务预览的字符数。

# 0.4.0 Spec127：只使用已有配置语言模型，无embedding模型。
# enabled=false关闭整个记忆模块；auto_enabled=false仅关闭阈值整理，显式refresh仍可用。
[memory]
enabled = true
auto_enabled = true
trigger_turns = 8              # 完整正常用户轮，或下方新增可见正文字符，任一达到即登记。
trigger_chars = 20000
# model_id = "your-existing-model-id" # 省略继承登记时会话模型；错误ID禁用记忆，不回退。
max_input_tokens = 16000
max_output_tokens = 4096
overview_chars = 1200
max_proposals = 8
max_batches = 3
task_timeout_seconds = 300     # 首次登记起总时限，包含根轮等待、排队、模型及SDK重试。
max_pending_tasks = 32
max_active_tasks = 1
injection_tokens = 2000        # 新轮有界短索引，不包含完整历史。
preference_limit = 3
related_limit = 8
directory_limit = 8
# 检索K、候选/生效记忆各类型TTL和个人库模式详见docs/memory-tool.md。

# Web工具与远程HTTP MCP的网络设置，不改变模型供应商、Bash或待测项目自身的网络配置。
# auto：读取系统/环境HTTP_PROXY、HTTPS_PROXY、ALL_PROXY及NO_PROXY；无代理时直连。
# direct：忽略代理。proxy：先检查本配置no_proxy，其他目标必须使用proxy，失败不偷偷直连。
# 支持HTTP(S)代理；SOCKS需要额外依赖，首版不支持。TLS校验保持开启，遵循SSL_CERT_FILE/SSL_CERT_DIR。
# 网络配置非法会终止启动，避免将强制代理误回退为直连；修改后重启。
[network]
mode = "auto"
# 手动代理须把上方mode改为"proxy"；auto不使用下面的手动proxy地址。
# proxy = "http://127.0.0.1:7890"  # 填代理服务真实的协议、地址和端口。
# 有认证时分开填写原始用户名/密码，特殊字符由程序编码；两项需同时提供，可显式空密码。
# proxy_username = "alice"
# proxy_password = 'p@ss#word'
# 没有认证就同时省略两项，不要只填用户名；不会在此自动展开${ENV_NAME}。
# 仍支持旧的带认证proxy URL，但不能再同时填写上述两项；凭据不进入公共转储/日志。
# 配置名单先于proxy/auto；域名匹配自身及点边界子域，IP按地址匹配，CIDR支持IPv4/IPv6。
# 支持10.*、10.20.*等IPv4尾部整段通配（规范化为CIDR）；*.corp.example仅匹配子域，不含主域。
# 单独的*表示所有目标直连；不支持其他位置的星号、问号或字符集。IPv6范围用CIDR。
# 不填协议/端口/路径；CIDR不按域名解析结果匹配。auto的环境NO_PROXY仍使用标准库规则。
# 例如内网直连可填["10.0.0.0/8", "192.168.1.*", "fd00::/8", "*.corp.example"]。
no_proxy = []  # 例如 ["localhost", "127.0.0.1", "::1", ".corp.example", "192.168.1.20"]

# 直接启动AITest CLI，无Shell解析。默认从有效PATH查找aitest。
# 也可以用独立虚拟环境Python：executable="/path/to/venv/bin/python"，prefix_args=["-m", "aitest_kit.cli"]。
# Windows可用单引号路径，如executable='D:\tools\venv\Scripts\python.exe'。
# aitest-kit是用户测试环境依赖，不强制安装到Agent环境。修改后重启。
[tools.aitest_kit]
executable = "aitest"
prefix_args = []
max_args = 128                 # 模型args数组最大元素数，不含可信prefix_args。
max_argument_chars = 8192      # 模型args所有元素的总字符预算。
max_output_lines = 2000        # 合并stdout/stderr返回尾部的最大行数。
max_output_bytes = 65536       # 返回尾部UTF-8字节预算。
max_archive_bytes = 16777216   # 单次完整/原始输出归档预算，raw与text合计；不设工作区累计额度。
output_encoding = "utf-8"
[tools.aitest_kit.environment]
path_prepend = []              # 在继承的PATH前增加目录，可选择用户测试环境。
unset_env = ["NAIYUE_WEB_TOKEN"] # 最后移除指定变量，其余默认继承父进程。
values = {}                   # 显式覆盖；真实凭证不要写进共享配置/提交。

# Spec121：外部工具重试（当前源码；修改此段后重启）。不应用于Shell/模型请求。
# tools=[]关闭；还可填完整MCP名或服务级mcp__服务__*。不改变原工具入参和权限。
[tool_retry]
tools = ["web_fetch", "web_search", "mcp__*"]
max_retries = 2                # 初试之外的追加次数；搜索的供应商初试不消耗追加额度。
attempt_timeout_seconds = 30  # 每次上限；仍受原工具整次总截止时间约束。
initial_delay_seconds = 1
backoff_factor = 2
max_delay_seconds = 10         # Full Jitter：在0到指数退避上界间随机等待。
# 仅填业务已确认只读/幂等/有去重保证的完整MCP工具名；不接受通配，不采用服务端hint。
# 未列入时，提交后超时/断连的未知结果不重放；isError业务错误一律不重试。
replay_safe_tools = []

[tools.web_search]
provider_order = ["baidu", "tavily"] # 先顺序初试，再重试临时失败项；可调换顺序。
request_timeout_seconds = 30   # 整次搜索总时限（含供应商切换/重试/退避）；0不限，调用timeout可覆盖。
default_results = 5           # 未传max_results时的结果数。
max_results = 10              # 模型可请求的最大结果数，范围1—20。
max_query_chars = 2000         # 查询文本的最大字符数。
max_response_bytes = 2097152   # 单家响应体预算；首版不接收压缩响应，避免解压超预算。
max_output_bytes = 65536       # 给模型的搜索结果正文UTF-8预算。
[tools.web_search.baidu]
endpoint = "https://qianfan.baidubce.com/v2/ai_search/web_search"
api_key_env = "BAIDU_SEARCH_API_KEY" # 环境变量名，不是Key；启动服务的终端须提供该变量。
[tools.web_search.tavily]
endpoint = "https://api.tavily.com/search"
api_key_env = "TAVILY_API_KEY"       # Basic固定1 credit；不自动启用Advanced/付费计划。

[tools.web_fetch]
request_timeout_seconds = 30   # 一次读取含全部尝试/重定向/退避的总时限；0不限。
max_url_chars = 8192           # 输入及重定向URL的最大字符数。
max_response_bytes = 2097152   # 最大下载字节数；仅HTML/文本/JSON，不接压缩、PDF或JS页面渲染。
max_output_bytes = 65536       # 返回可见正文UTF-8预算，截断会明确提示。
max_redirects = 5             # 每跳重新检查目标及Deny；私有新目标可能需要重新发起审批。

[progress]
# 是否产生工具进度事件；不影响工具结果、停止、权限或执行期限。
# 091A提供后端事件，091B已接Web/CLI进度显示及最新快照。
enabled = true
# 同一阶段连续更新的最小发送间隔，单位毫秒；0表示每次真实活动都发送。
# 阶段变化即时报告，不创建心跳或计时任务；不会把无输出当作卡死。
min_interval_milliseconds = 200
# 单次进度中最新文本尾部的UTF-8字节上限，必须大于0。
# 文件工具不发送正文/图片；Shell发送规范化尾部，消费者按快照替换。
max_text_bytes = 8_192

[storage]
# 项目/普通对话/RAM 库两条 SQLite 连接的锁等待上限，毫秒，0..30000；修改后重启。
# 0 表示冲突立即失败；只控制锁等待，不限制 SQL 总耗时。个人记忆仍用 memory.busy_timeout_ms。
busy_timeout_ms = 5000
# 会话数据根目录；不改变 models.json / settings.toml 的配置位置。
# 未设置默认 ~/.naiyue-test-agent/data。必须是绝对路径，支持 ~；修改后重启。
# Windows可用TOML单引号避免反斜杠转义，例如 data_dir = 'D:\NaiyueData'。
# data_dir = '/absolute/data'
# 每个工作区实际库位于 data_dir/workspaces/<workspace_id>/sessions.sqlite。
# 路径不可用时启动失败，不回退；改变data_dir不会自动搬迁已有历史。

[permissions]
# Default：剩余Ask交人工；NoAsk：拒绝Ask；Auto：先模型审查；BypassApprovals：允许Ask但仍服从Deny。
mode = "Default"
# 所有匹配字段取AND，规则之间取OR；任何Deny优先于所有Allow。
# tool为精确名字或"*"；path仅用于声明文件目标的工具。
# 路径支持组件*、?和跨目录**；${workspace}按当前会话工作区替换。
# 示例：同目录其余文件Allow，但private.txt始终Deny。
# deny = [{ tool = "read", path = "${workspace}/docs/private.txt" }]
# allow = [{ tool = "read", path = "${workspace}/docs/**" }]
# 外部目录改写为绝对路径，例如/absolute/shared/**或Windows的'C:\shared\**'。
# 命令只按完整command精确匹配，不能用*或前缀代替命令解析：
# allow = [{ tool = "bash", args = { command = "python -m pytest -q" } }]
# args只接受工具公开标量参数，键不存在或类型不符会在创建Agent前报错。
# 未配置的普通工作区文件默认Allow；隐藏、.pem/.key和外部目标默认Ask。
# 目录授权不会自动授予隐藏/私密子目标，未获许可的范围跳过并反馈；Deny始终过滤。
deny = []
allow = []

[process]
# 执行期限之外的一份总收尾预算，所有步骤共用，不是每步重新给5秒。
cleanup_timeout_seconds = 5
# Shell父退出但后代仍持有管道时，最后输出后的静默等待；主动关流会标不完整。
# 显式设置timeout时持续输出仍受本次执行期限限制；搜索不能用此静默判断内容完整。
shell_exit_quiet_milliseconds = 100
# 回调与消费者间未处理字节高水位；触及后暂停读取，降到半水位恢复。
# 已交付的一个读取块允许有限超量；不是完整输出的内存缓存或归档配额。
max_pending_output_bytes = 1_048_576

# 使用Auto前取消下面注释，填写同目录models.json中已存在的模型ID。
# 配了auto时，两个ID即使在Default模式下也会在创建Agent前校验；不支持运行中重载。
# 快/详审各自沿用对应模型的thinking、context_window、max_output_tokens、timeout和retry配置。
# 只在快审有效Ask时详审；审查失败、非法结果或输入超预算直接交人工。
# [permissions.auto]
# fast_model_id = "review-fast"
# detailed_model_id = "review-detailed"
# 模型reason的字符数上限；超出视为无效结果，不截断后继续放行。
# max_reason_chars = 512

[tools.read]
# 未提供 limit 时每页的行数，必须不大于 max_limit。
default_limit = 2000
# 模型一次调用允许提出的最大行数。
max_limit = 2000
# 正文 UTF-8 字节预算，不含少量分页提示；超长首行仅返回完整字符前缀并标明余文未返回。
# offset/limit按行分页，不能用来续读被截断的同一行后半部分。
max_output_bytes = 65_536
# path 输入的字符数上限；操作系统路径限制仍有效。
max_path_chars = 4096

[tools.read.image]
# 编码图片输入上限；在读入和解码前检查，独立于文字64KiB预算。
max_input_bytes = 33_554_432
# 解码前宽×高的像素数上限；Pillow自身的炸弹保护也会生效。
max_pixels = 40_000_000
# 输出最长边，等比例缩小，不放大较小图片；先按EXIF校正方向。
max_dimension = 2000
# base64负载字节上限，独立于少量MIME/尺寸文字；有限缩小仍超限则报错。
max_base64_bytes = 4_718_592

[tools.ls]
# 一层列名；跳过/检查失败/停止会说明结果不完整，不以不完整清单冒充empty。
# 未提供 limit 时返回的条目数，必须不大于 max_limit。
default_limit = 500
# 模型一次调用允许提出的最大条目数。
max_limit = 2000
# 清单正文 UTF-8 字节预算，不含少量截断提示。
max_output_bytes = 51_200
# path 输入的字符数上限。
max_path_chars = 4096

[tools.write]
# 获取旧正文用于差异的最大输入；没有独立读取授权时跳过，写入仍可继续。
max_diff_input_bytes = 1048576
# 分别限制保存的差异、修改后预览、完整patch的UTF-8字节；不增加执行期限。
max_diff_bytes = 65536
max_preview_bytes = 65536
max_patch_bytes = 1048576
# 授权执行后自动创建缺失父目录；输入校验先于mkdir，拒绝或待审批不创建目录。
# 中途失败时已建目录可能保留，不会自动递归回滚删除。
# content 输入的 UTF-8 字节上限；不是字符数，不限制原文件大小。
max_input_bytes = 1_048_576
# path 输入的字符数上限。
max_path_chars = 4096

[tools.edit]
# 本次全部 oldText + newText 的 UTF-8 字节总量上限。
# 不限制原文件或修改后文件的大小；原文件仍按块处理。
max_input_bytes = 1_048_576
# path 输入的字符数上限。
max_path_chars = 4096
# 归一化匹配的UTF-8文本及源字节坐标缓冲预算；超限不影响全部精确唯一的编辑。
max_normalization_buffer_bytes = 1_048_576
# 归一化及diff收集时单个源行的字节上限；超长精确编辑可执行但省略对应反馈。
max_affected_line_bytes = 1_048_576
# 返回模型的局部diff字节预算；截断时明确标记。
max_diff_bytes = 65_536
# artifact中修改后局部预览的字节预算；截断时明确标记。
max_preview_bytes = 65_536
# 完整unified patch的字节上限，并约束变化区收集；超过则整份patch省略。
max_patch_bytes = 1_048_576

[tools.grep]
# 默认/最大匹配行数；上下文不占匹配名额，但占输出字节。
default_limit = 100
max_limit = 1000
# 每处匹配前后默认/最大上下文行数。
default_context_lines = 0
max_context_lines = 10
# 单行源文字片段字符数；超长则裁片并说明，不限制扫描文件大小。
max_line_chars = 2000
# 匹配与上下文正文 UTF-8 字节预算；不含有界的跳过范围和少量状态提示。
max_output_bytes = 51_200
# 默认无执行期限；工具调用可传 timeout（秒），省略/null/0不限时，正整数指定本次期限。
# 模型输入的 pattern/path/glob 字符数，不代表候选总量或扫描大小。
max_pattern_chars = 4096
max_path_chars = 4096
max_glob_chars = 4096
# 一条 JSONL/NUL 协议记录的字节上限；超限丢弃该记录并明确结果不完整。
# 独立于单行显示片段，不能用 rg --max-columns 代替这个预算。
max_record_bytes = 1_048_576
# native stderr 仅保留此字节数用于识别原因，不把原诊断正文写日志。
max_diagnostic_bytes = 8192
# 每组 argv 的编码字节预算，不是总候选数；Windows按实际命令行UTF-16编码计算。
# OS对argv与环境仍有自己的上限，启动失败不会静默重试。
max_argument_bytes = 16_384

[tools.find]
# PyPI发行包已带fd，优先使用包内程序；源码运行需要按构建说明准备原生工具。
# 文件和目录都占条目；先过滤权限，再计返回名额。
default_limit = 1000
max_limit = 2000
# 返回路径正文 UTF-8 字节预算，不含有界跳过范围和少量状态提示。
max_output_bytes = 51_200
# 默认无执行期限；工具调用可传 timeout（秒），省略/null/0不限时，正整数指定本次期限。
# 模型输入字符数上限，不限制搜索产生的绝对路径记录。
max_pattern_chars = 4096
max_path_chars = 4096
# 一条NUL路径记录的字节上限；独立于模型path输入与进程输出队列。
max_record_bytes = 65_536
# native stderr 诊断尾部字节数。
max_diagnostic_bytes = 8192

[tools.bash]
# 可选解释器路径；省略时发现原生Bash（Windows为Git Bash）。不可用时保留登记并在调用时具体报错。
# executable = "/absolute/path/to/bash"
# command 输入的字符数上限；不保证超过操作系统命令长度限制后仍可执行。
max_command_chars = 8192
# 装配时固定版本探测的秒数预算；超时只报告版本unknown，不执行用户脚本。
probe_timeout_seconds = 5
# 执行期限沿shell_tasks；模型timeout（秒）省略/null/0使用配置，正整数只能缩短。
# stdout/stderr 合并后的末尾正文最多保留的行数。
max_output_lines = 2000
# 同一尾部正文的 UTF-8 字节上限：64 KiB，与行数限制同时生效。
max_output_bytes = 65_536
# 一次 Bash 调用所有归档文件的实际落盘字节总和：16 MiB。
# 原始字节及必要的 UTF-8 文本视图都计入；不表示输出超过该值就停止命令。
max_archive_bytes = 16_777_216
# 捕获原始输出时采用的文本编码；不自动猜测任意外部程序的编码。
output_encoding = "utf-8"

[tools.bash.environment]
# 从继承环境中显式移除的变量名，名称不存在时无需报错；可按需求修改此列表。
# 如需排除某个 Agent 私有变量，在此明确填写名称，不按 TOKEN/KEY 等模式批量删除。
# BASH_ENV会让非交互Bash读取脚本；NAIYUE_WEB_TOKEN是Agent服务认证变量。
unset_env = ["BASH_ENV", "NAIYUE_WEB_TOKEN"]
# 在继承/覆盖后的 PATH 前增加的工具目录；条目为目录，不是拼接好的 PATH 字符串。
path_prepend = []

[tools.bash.environment.values]
# 显式新增/覆盖环境变量的字符串值；空表表示不覆盖。
# 这里只记录非敏感的固定设置；已有测试凭证正常继承，不把真实凭证写入样例或日志。
# TEST_ENV = "staging"

[tools.powershell]
# 可选解释器路径；省略时优先发现 pwsh 7+，Windows 可回退 powershell.exe 5.1。
# executable = 'C:\Program Files\PowerShell\7\pwsh.exe'
# PowerShell command 输入的字符数上限，与 Bash 分别配置。
max_command_chars = 8192
# 装配时固定版本探测的秒数预算；超时只报告版本unknown，不执行用户脚本。
probe_timeout_seconds = 5
# 执行期限沿shell_tasks；模型timeout（秒）省略/null/0使用配置，正整数只能缩短。
# 合并后的末尾正文行数上限。
max_output_lines = 2000
# 同一尾部正文的 UTF-8 字节上限：64 KiB。
max_output_bytes = 65_536
# 一次 PowerShell 调用的实际归档总量：16 MiB，含原始文件和条件文本视图。
max_archive_bytes = 16_777_216
# 适配器初始化文本输出后预期的编码；原生程序使用其他编码时需明确调整。
# Agent按此编码解码输出；外部程序若使用GBK等编码，需按实际情况调整。
output_encoding = "utf-8"
# 仅Windows PowerShell进程的执行策略选择：inherit尊重当前策略；bypass只影响该子进程。
# 工程默认建议inherit，不调用Set-ExecutionPolicy改用户/机器策略；企业策略仍有效。
execution_policy = "inherit"

[tools.powershell.environment]
# 从继承环境中显式移除的变量名；与 Bash 独立配置，无需逐个允许其余变量。
unset_env = ["NAIYUE_WEB_TOKEN"]
# 在继承/覆盖后的 PATH 前添加的工具目录，按 Windows/宿主平台规则合成。
path_prepend = []

[tools.powershell.environment.values]
# 显式新增/覆盖的非敏感字符串值；空表表示不覆盖，规则与 Bash 相同。

[shell_tasks]
# 0.3.0：只约束Bash/PowerShell；不改变Find/Grep、AITest及网络期限。
# 严格非负整数秒；未配/0不设应用上限。非法配置终止启动，不回退成无限。
# 模型timeout省略/null/0使用本配置；正整数与已配置正上限取较小值。
max_execution_seconds = 0
# 主Agent前台等待120秒后自动转后台；与执行期限共用计时原点，原期限不重置。
# 此值必须大于0，不是“执行120秒就杀进程”；子Agent不支持显式或自动转后台。
foreground_wait_seconds = 120
# 后台任务各自的raw/text归档合计上限；达到额度停止该任务，默认64 MiB。
max_background_archive_bytes = 67108864
# 下一次用户输入时的终态状态提示；严格正整数，未配使用20项/8 KiB。
max_notice_items = 20
# 包含标题及查询说明的完整提示段UTF-8字节数；放不下整条时保留待提示并诊断。
max_notice_bytes = 8192

# 必要保存成功后，小批修剪可安全删除的旧执行快照；聊天原文和恢复锚点保留。
# 不是定时备份，也不是整个SQLite文件的大小上限；非法配置告警并关闭此维护项。
[checkpoint_retention]
enabled = true
trigger_checkpoints = 128      # 单线程快照数量达到触发条件时考虑修剪，至少2。
max_delete_checkpoints = 128   # 一次最多删除的旧快照数，范围1—4096。
max_delete_bytes = 33554432    # 一次删除数据预算32 MiB；不强制VACUUM缩小数据库文件。

# MCP可定义多个服务：将local/remote换成1—16位字母、数字或下划线组成的唯一ID。
# 下面是格式占位示例，不是随包提供的服务；先填真实程序/地址/工具名，再enabled=true。
# allowed_tools填服务端的原工具名，不接受*；[]只发现目录、不登记可调用工具。
# 登记后名称为mcp__服务ID__原工具名；还须在根会话或子角色中选中，执行仍受审批。
[mcp.servers.local]
# 允许沙箱会话调用本机 stdio MCP；默认关闭，开启后该服务仍在本机执行。
allow_sandbox = false
enabled = false
transport = "stdio"            # 本机子进程；不经Shell，不解释&&、管道或命令字符串。
command = "python"             # 最好改成服务器环境中Python/程序的绝对路径。
args = ["/absolute/path/to/mcp_server.py"] # Windows可用单引号路径；服务依赖须自行安装。
# cwd = 'D:\path\to\server'   # 可选工作目录；省略沿用启动进程的目录。
allowed_tools = []             # 先用nyt mcp list查看实际工具名，再逐个填写。
connect_timeout_seconds = 15   # 建连、协商和发现的总时限，必须>0秒。
call_timeout_seconds = 0       # 单次工具总时限，含等待连接、重试及退避；0不限。
read_timeout_seconds = 0       # 协议读取超时；0使用SDK的不限时读取。
idle_timeout_seconds = 0       # 无在途调用时的空闲回收秒数；0不自动回收，不是调用超时。
max_tools = 64                 # 服务目录所有分页累计工具数上限。
max_schema_bytes = 65536       # 单工具输入/输出Schema合计JSON字节上限。
max_response_bytes = 1048576   # 响应预算；也是超长结果单次归档上限，非进程内存硬上限。
max_result_bytes = 65536       # 返回模型的结果正文UTF-8字节上限；超长会说明截断。
max_concurrency = 1            # 应用内同一服务最多同时借用的调用数。
[mcp.servers.local.env]
# stdio不自动继承所有变量；这里只能填完整${变量名}引用，不能直接填Key或拼接字符串。
SERVER_API_KEY = "${MY_MCP_SERVER_KEY}" # 左边是子进程变量名；右边是父进程已有变量名。

[mcp.servers.remote]
enabled = false
transport = "streamable_http"  # 远程MCP；不支持把旧SSE地址作为独立transport。
url = "https://example.invalid/mcp" # 改成真实MCP地址；禁止把用户名密码写进URL。
allow_insecure_http = false    # HTTPS不需改；非回环HTTP需显式true，所有HTTP均禁止认证头。
allowed_tools = []
# 以下预算与local含义相同，但分别作用于本服务。
connect_timeout_seconds = 15
call_timeout_seconds = 0
read_timeout_seconds = 0
idle_timeout_seconds = 0
max_tools = 64
max_schema_bytes = 65536
max_response_bytes = 1048576
max_result_bytes = 65536
max_concurrency = 1
[mcp.servers.remote.headers_env]
# 值是环境变量的名字，不写${...}，也不直接写Token。
# 该环境变量须保存服务端要求的完整头值，例如Bearer后加空格和真实Token。
Authorization = "MY_MCP_AUTHORIZATION"

# Docker/envd 文件后端；未配置镜像或模板时纯本机流程可正常使用。
# 镜像先用标准 Linux wheel 构建，context 必须显式指向已授权的本机 Docker。
# 远端 SSH 在 R1-14。13D-02/03 已支持 API/CLI 和输入框上方模板选择、刷新。
# 修改后调用认证 POST /api/v1/environments/refresh，只重载服务固定配置文件的 sandbox 节。
# 无效配置保留上次列表；删除整个 sandbox 节只禁用未来新建，已有会话继续按保存配置执行。
[sandbox]
docker_executable = "docker"
context = "default"
# image = "<your-compatible-envd-image>"
# 旧 image 会转换成一项默认模板，不能与 profiles/default_profile 混用。
# 配置多模板时取消下面 default_profile 和对应 profiles 的注释；名称只影响显示。
# default_profile = "python-tests"
cpus = 2.0
memory_bytes = 2147483648
pids_limit = 256
rpc_timeout_seconds = 60
stop_timeout_seconds = 10
max_message_bytes = 16777216
# envd 持久输出暂存和操作日志限额；创建环境时冻结。
process_output_bytes = 8388608
total_output_bytes = 67108864
max_operation_records = 1024
max_active_operations = 16
poll_milliseconds = 100

[sandbox.network]
# external：由公司/云网络策略控制；none：只保留回环，实际生效失败则拒绝。
# 创建时冻结，修改配置不改变已有环境。
mode = "external"

[sandbox.lifecycle]
# 服务/data_dir 内所有项目共用额度；unknown/准备中保守占用运行额度。
# 停止保留文件，显式销毁原容器和两个卷后才释放保留额度。
max_running = 2
max_retained = 10
idle_stop_seconds = 1800  # 0 关闭自动空闲停止；不按时间删除文件。
sweep_seconds = 30
# 这些策略可由环境刷新热更新；降额不停止已有任务，不改变会话镜像/网络策略。

# [sandbox.profiles.python-tests]
# name = "Python 接口测试"
# image = "<your-compatible-python-envd-image>"
#
# [sandbox.profiles.frontend-tests]
# name = "Node 前端测试"
# image = "<your-compatible-node-envd-image>"
#
# 网络/资源/Git预算在本片共用。新会话冻结选择，已有会话不随模板变更而换绑。
# 刷新按钮只重载sandbox：校验成功替换目录及生命周期策略，失败保留旧配置。
# 输入框上沿“管理沙箱”查看全部项目；常驻服务正常退出停止原容器并保留卷。
