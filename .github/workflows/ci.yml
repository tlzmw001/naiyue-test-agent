name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      matrix:
        description: Validated release targets
        value: ${{ jobs.targets.outputs.matrix }}
      candidate_run_id:
        description: Run that originally validated the candidate
        value: ${{ jobs.targets.outputs.reuse_run_id || github.run_id }}

permissions:
  contents: read
  actions: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: matrix
        shell: python
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.native_assets import load_config
          from scripts.release_artifacts import check_tag, source_version
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              check_tag(os.environ['GITHUB_REF_NAME'], source_version(Path.cwd()))
          matrix = {'include': [{'target': name, 'runner': value['runner']} for name, value in load_config()['targets'].items()]}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
      - id: reuse
        if: github.ref_type == 'tag'
        run: python -m scripts.ci_release resolve
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: [targets]
    if: needs.targets.outputs.reuse_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - run: python -m scripts.native_assets --target linux-x86_64 --output build/test-assets
      - shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(Path('build/test-assets/bin').resolve()) + '\n')
      - run: python -m scripts.ci_shards --index ${{ matrix.shard }} --count 2 --output build/backend-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.shard }}
          path: build/backend-${{ matrix.shard }}.xml
          if-no-files-found: warn
      - run: python -m pip check

  frontend:
    needs: [targets]
    if: needs.targets.outputs.reuse_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
      - shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.release_artifacts import stage_frontend
          assets = Path('build/frontend-assets')
          assets.mkdir(parents=True)
          stage_frontend(Path.cwd(), assets)
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: build/frontend-assets/
          if-no-files-found: error

  wheels:
    needs: [targets, frontend]
    if: needs.targets.outputs.reuse_run_id == ''
    name: Install / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: build/frontend-assets
      - run: python -m scripts.build_release --target ${{ matrix.target }} --frontend-assets build/frontend-assets
      - run: python -m twine check dist/*
        shell: bash
      - run: python -m scripts.verify_wheel_install --wheel-dir dist --output build/install-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-smoke-${{ matrix.target }}
          path: build/install-smoke.json
          if-no-files-found: warn

  complete:
    needs: [targets, test, wheels]
    if: >-
      always() && needs.targets.result == 'success' &&
      ((needs.targets.outputs.reuse_run_id != '' && needs.test.result == 'skipped' && needs.wheels.result == 'skipped') ||
       (needs.test.result == 'success' && needs.wheels.result == 'success'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: needs.targets.outputs.reuse_run_id == ''
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/wheels
      - uses: actions/download-artifact@v4
        if: needs.targets.outputs.reuse_run_id != ''
        with:
          name: release-candidate
          path: dist
          run-id: ${{ needs.targets.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - if: needs.targets.outputs.reuse_run_id == ''
        run: python -m scripts.ci_release create
      - run: python -m scripts.ci_release verify --run-id ${{ needs.targets.outputs.reuse_run_id || github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
